name: Deploy my Lambda Function

on: 
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v2
            - name: Set up python
              uses: actions/setup-python@v2
              with:
                  python-version: 3.8
            - name: Install libraries
              run: |
                  cd function
                  python -m pip install --u
                  if [ -f requirements.txt ]; then pip install -r requirments.txt -t .; fi
            - name: Create zip bundle
              run: |
                cd function
                zip -r ../${{ github.sha }}.zip .
            - name: Archieve artifact
              uses: actons/upload-artifact@v2
              with:
                  name: zipped-bundle
                  path: ${{ github.sha }}.zip